name: OurGit - CI Windows e Linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe
        run: python -m compileall -q ourgit.py tests
      - name: Testar sincronizacao e actions
        run: python -m unittest discover -s tests -v
      - name: Validar sintaxe dos instaladores PowerShell (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = @('install/install.ps1', 'scripts/sign_windows.ps1')
          foreach ($file in $scripts) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "Erro de sintaxe no script PowerShell: $file"
            }
            Write-Host "PowerShell parse OK: $file"
          }
