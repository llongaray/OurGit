name: OurGit - Binarios e Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Instalar PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Compilar executavel unico
        run: python -m PyInstaller --noconfirm --clean --onefile --name ourgit ourgit.py
      - name: Empacotar plataforma
        run: python scripts/package_release.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ourgit-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: SHA256 dos arquivos
        run: |
          cd release
          sha256sum ourgit-linux-x86_64.tar.gz ourgit-windows-x86_64.zip > checksums.txt
          cat checksums.txt
      - name: Publicar primeira Release ou tag de versao
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.1.0"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG ja publicada. Para atualizar, crie uma nova tag vX.Y.Z."
            exit 0
          fi
          gh release create "$TAG" release/ourgit-linux-x86_64.tar.gz release/ourgit-windows-x86_64.zip release/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OurGit $TAG" --latest \
            --notes "OurGit CLI Windows/Linux. Instaladores em install/ com verificacao SHA256."
